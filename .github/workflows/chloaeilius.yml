name: chloaeilius (spatial audio)

# Chloaeilius, the spatial audio (3rd-order Ambisonics) version of Chloaeilius, in the Chloaeilius folder.
# Builds when it changes; a tag chloaeilius-vX.Y.Z makes its own release (separate from Chloaeilius's vX.Y.Z).
on:
  push:
    branches: [ main ]
    tags: [ 'chloaeilius-v*' ]
    paths: [ 'Chloaeilius/**', '.github/workflows/chloaeilius.yml' ]
  pull_request:
    paths: [ 'Chloaeilius/**', '.github/workflows/chloaeilius.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: Chloaeilius-macOS.zip
          - name: Windows
            os: windows-latest
            package: Chloaeilius-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            package: Chloaeilius-Linux.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ladspa-sdk ninja-build xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S Chloaeilius -B build $GEN -DCMAKE_BUILD_TYPE=Release -DCHLOAEILIUS_BUILD_TESTS=ON -DCHLOAEILIUS_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --target Chloaeilius_All --parallel 4

      # the sound checks, on every system: the same offline tests as on the Mac (the full-interface
      # host tests stay on the Mac); Linux runs them on a virtual display
      - name: Test
        shell: bash
        run: |
          cmake --build build --config Release --target ChloaeiliusTest ChloaeiliusSpatialTest --parallel 4
          for t in ChloaeiliusTest ChloaeiliusSpatialTest; do
            exe=$(find build -path "*${t}_artefacts*" -type f \( -name "$t" -o -name "$t.exe" \) | head -1)
            echo "== $t: $exe"
            set +e
            if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$exe"; else "$exe"; fi
            code=$?
            set -e
            echo "== $t exit code $code"
            [ $code -eq 0 ] || fails=$((fails + 1))
          done
          exit ${fails:-0}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/Chloaeilius_artefacts/Release
          mkdir -p dist/Chloaeilius
          cp -R "$A/Standalone/Chloaeilius.app" "$A/AU/Chloaeilius.component" "$A/VST3/Chloaeilius.vst3" dist/Chloaeilius/
          # ad-hoc signatures (not notarised: see the README for the first-launch step)
          codesign --force --deep -s - dist/Chloaeilius/Chloaeilius.app
          codesign --force --deep -s - dist/Chloaeilius/Chloaeilius.component
          codesign --force --deep -s - dist/Chloaeilius/Chloaeilius.vst3
          cp Chloaeilius/README.md LICENSE dist/Chloaeilius/
          cd dist && ditto -c -k --keepParent Chloaeilius "${{ matrix.package }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/Chloaeilius_artefacts/Release"
          New-Item -ItemType Directory -Force dist/Chloaeilius | Out-Null
          Copy-Item -Recurse "$A/VST3/Chloaeilius.vst3" dist/Chloaeilius/
          Copy-Item "$A/Standalone/Chloaeilius.exe" dist/Chloaeilius/
          Copy-Item Chloaeilius/README.md, LICENSE dist/Chloaeilius/
          Compress-Archive -Path dist/Chloaeilius -DestinationPath "dist/${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A=build/Chloaeilius_artefacts/Release
          mkdir -p dist/Chloaeilius
          cp -R "$A/VST3/Chloaeilius.vst3" "$A/LV2/Chloaeilius.lv2" dist/Chloaeilius/
          cp "$A/Standalone/Chloaeilius" dist/Chloaeilius/
          cp Resources/icon/chloaeilius_1024.png dist/Chloaeilius/chloaeilius.png
          cp Chloaeilius/README.md LICENSE dist/Chloaeilius/
          tar -czf "dist/${{ matrix.package }}" -C dist Chloaeilius

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/chloaeilius-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          name: Chloaeilius (spatial audio) ${{ github.ref_name }}
          generate_release_notes: true
