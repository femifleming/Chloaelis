name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: Chloaelis-macOS.zip
          - name: Windows
            os: windows-latest
            package: Chloaelis-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            package: Chloaelis-Linux.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -B build $GEN -DCMAKE_BUILD_TYPE=Release -DCHLOAELIS_BUILD_TESTS=OFF -DCHLOAELIS_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --target Chloaelis_All --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/Chloaelis_artefacts/Release
          mkdir -p dist/Chloaelis
          cp -R "$A/Standalone/Chloaelis.app" "$A/AU/Chloaelis.component" "$A/VST3/Chloaelis.vst3" dist/Chloaelis/
          # ad-hoc signatures (not notarised: see the README for the first-launch step)
          codesign --force --deep -s - dist/Chloaelis/Chloaelis.app
          codesign --force --deep -s - dist/Chloaelis/Chloaelis.component
          codesign --force --deep -s - dist/Chloaelis/Chloaelis.vst3
          cp README.md LICENSE dist/Chloaelis/
          cd dist && ditto -c -k --keepParent Chloaelis "${{ matrix.package }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/Chloaelis_artefacts/Release"
          New-Item -ItemType Directory -Force dist/Chloaelis | Out-Null
          Copy-Item -Recurse "$A/VST3/Chloaelis.vst3" dist/Chloaelis/
          Copy-Item "$A/Standalone/Chloaelis.exe" dist/Chloaelis/
          Copy-Item README.md, LICENSE dist/Chloaelis/
          Compress-Archive -Path dist/Chloaelis -DestinationPath "dist/${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A=build/Chloaelis_artefacts/Release
          mkdir -p dist/Chloaelis
          cp -R "$A/VST3/Chloaelis.vst3" "$A/LV2/Chloaelis.lv2" dist/Chloaelis/
          cp "$A/Standalone/Chloaelis" dist/Chloaelis/
          cp Resources/icon/icon_1024.png dist/Chloaelis/chloaelis.png
          cp README.md LICENSE dist/Chloaelis/
          tar -czf "dist/${{ matrix.package }}" -C dist Chloaelis

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
